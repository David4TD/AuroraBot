name: Claude Code

# Runs Claude Code in CI and lets it commit its own changes.
#
# Two ways to trigger it:
#   1. Mention @claude in an issue, PR, or review comment. Claude reads the
#      thread, makes the changes, and commits them to the PR branch (or to a
#      new branch off the issue, which it then opens a PR for).
#   2. Run it manually from the Actions tab ("Run workflow") with a free-form
#      prompt — the changes are committed straight to the branch you picked.
#
# Setup: add an ANTHROPIC_API_KEY repository secret
# (Settings -> Secrets and variables -> Actions).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
  workflow_dispatch:
    inputs:
      prompt:
        description: "What should Claude do?"
        required: true
        default: "Review the repo for bugs and fix any you find."

jobs:
  claude:
    # Only run on @claude mentions, or when dispatched manually.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # required so Claude can push commits
      pull-requests: write
      issues: write
      id-token: write
      actions: read          # lets Claude read CI logs when fixing failures
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # On workflow_dispatch we pass an explicit prompt; on @claude events
          # this is empty and the action picks up the comment/issue context.
          prompt: ${{ github.event.inputs.prompt }}
          claude_args: |
            --allowedTools "Bash(git:*),Bash(pip:*),Bash(python:*),Bash(pytest:*)"

      - name: Commit and push any leftover changes
        # The action normally commits its own work. This is a safety net for
        # manual runs so nothing Claude edited is lost.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "claude[bot]"
            git config user.email "claude[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: apply Claude Code changes

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No uncommitted changes."
          fi
